approval_policy = "on-request"
approvals_reviewer = "user"
model_reasoning_effort = "medium"
model_provider = "open_router"
model = "z-ai/glm-5.2"

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "reasoning", "context-used", "used-tokens", "total-input-tokens", "total-output-tokens"]
status_line_use_colors = true

[features]
hooks = true
terminal_resize_reflow = true

# The opt-in config defaults to OpenRouter.
[model_providers.open_router]
name = "Open Router"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPEN_ROUTER_KEY"
wire_api = "responses"
